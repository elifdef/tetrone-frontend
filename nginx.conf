server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128M;

    # 1. Проксі API на бекенд
    location ^~ /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Проксі WebSockets
    location ^~ /socket.io/ {
        proxy_pass http://socket:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Внутрішня роздача приватних вкладень чату через X-Accel-Redirect
    location ^~ /protected_chats/ {
        internal;
        alias /var/www/storage/app/private/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 4. Пряма роздача публічних медіафайлів, стікерів та аудіо з диска
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 30d;

        include /etc/nginx/mime.types;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range,DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range,DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # 5. Кешування статики самого фронтенду
    location ~* \.(?:ico|css|js|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 6. React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}