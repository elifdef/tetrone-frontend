
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128M;

    # API
    location ^~ /v1/ {
        proxy_pass http://backend:8000/v1/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # WebSockets
    location ^~ /socket.io/ {
        proxy_pass http://socket:3000/socket.io/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Приватні вкладення чату
    location ^~ /protected_chats/ {
        internal;

        alias /var/www/storage/app/private/;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # Публічні медіафайли, включно з HLS
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;

        access_log off;
        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Accept, Origin, Cache-Control, If-Modified-Since, X-Requested-With" always;

        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type, Accept, Origin, Cache-Control, If-Modified-Since, X-Requested-With" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
            add_header Access-Control-Max-Age 1728000 always;

            return 204;
        }
    }

    # Кешування статики фронтенду
    location ~* \.(?:ico|css|js|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
    }

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
