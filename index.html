<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME%</title>
      <script>
          (function() {
              try {
                  var saved = localStorage.getItem('tetrone_personalization');
                  if (saved) {
                      var prefs = JSON.parse(saved);
                      var activeTheme = prefs.siteTheme || prefs.name;
                      if (prefs.isDark) document.documentElement.setAttribute('data-theme', 'dark');
                      if (activeTheme && activeTheme !== 'classic') document.documentElement.setAttribute('data-style', activeTheme);
                  }
              } catch (e) {}
          })();
      </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
