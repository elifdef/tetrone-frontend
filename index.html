<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME%</title>
      <script>
          (function() {
              try {
                  var saved = localStorage.getItem('app_theme');
                  if (saved) {
                      var theme = JSON.parse(saved);
                      if (theme.isDark) document.documentElement.setAttribute('data-theme', 'dark');
                      if (theme.name && theme.name !== 'default') document.documentElement.setAttribute('data-style', theme.name);
                  }
              } catch (e) {}
          })();
      </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
